<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Where Are You?</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --border: #2a2a3a;
      --accent: #00f5c4; --accent2: #ff5f7e; --text: #e8e8f0; --muted: #6b6b80;
    }
    body {
      background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px; opacity: 0.4; z-index: 0;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,245,196,0.06) 0%, transparent 70%);
      z-index: 0;
    }
    .card {
      position: relative; z-index: 1; background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px; padding: 52px 48px;
      width: min(460px, 90vw); text-align: center;
      box-shadow: 0 0 0 1px rgba(0,245,196,0.05), 0 30px 80px rgba(0,0,0,0.6);
    }
    .globe { font-size: 56px; display: block; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; }
    h1 span { color: var(--accent); }
    .subtitle { color: var(--muted); font-size: 0.9rem; font-family: 'Space Mono', monospace; margin-bottom: 36px; }
    .btn {
      background: var(--accent); color: #000; font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 1rem; border: none; padding: 14px 36px;
      border-radius: 50px; cursor: pointer; letter-spacing: 0.04em;
      transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 0 24px rgba(0,245,196,0.3);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(0,245,196,0.5); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .result {
      margin-top: 32px; background: rgba(0,245,196,0.04);
      border: 1px solid rgba(0,245,196,0.15); border-radius: 14px;
      padding: 24px; display: none; animation: slideUp 0.4s ease;
    }
    .result.show { display: block; }
    @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .result-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .result-row:last-child { border-bottom: none; }
    .result-label { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .result-value { font-weight: 700; font-size: 1rem; color: var(--accent); max-width: 60%; text-align: right; }
    .spinner {
      display: none; width: 28px; height: 28px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 20px auto 0;
    }
    .spinner.show { display: block; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .status { margin-top: 16px; font-size: 0.78rem; color: var(--muted); font-family: 'Space Mono', monospace; min-height: 20px; }
    .status.error { color: var(--accent2); }
    .source-tag { margin-top: 16px; font-size: 0.7rem; color: var(--muted); font-family: 'Space Mono', monospace; }
  </style>
</head>
<body>
  <div class="card">
    <span class="globe">🌍</span>
    <h1>Where are <span>you?</span></h1>
    <p class="subtitle">// click to detect your location</p>

    <button class="btn" id="detectBtn" onclick="detectLocation()">Detect My Location</button>

    <div class="spinner" id="spinner"></div>
    <div class="status" id="status"></div>

    <div class="result" id="result">
      <div class="result-row">
        <span class="result-label">Country</span>
        <span class="result-value" id="val-country">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Region / State</span>
        <span class="result-value" id="val-region">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">City</span>
        <span class="result-value" id="val-city">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">IP Address</span>
        <span class="result-value" id="val-ip">—</span>
      </div>
      <p class="source-tag" id="val-source"></p>
    </div>
  </div>

  <script>
    // ── JSONP helper ──────────────────────────────────────────────────────────
    // Injects a <script> tag; the API wraps its JSON in a callback function.
    // This completely bypasses CORS — works from file://, localhost, anywhere.
    function jsonp(url, callbackParam, timeout = 8000) {
      return new Promise((resolve, reject) => {
        const cbName = '__jsonp_cb_' + Date.now();
        const script = document.createElement('script');
        const timer  = setTimeout(() => {
          cleanup();
          reject(new Error('Timeout'));
        }, timeout);

        function cleanup() {
          clearTimeout(timer);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.src = `${url}?${callbackParam}=${cbName}`;
        script.onerror = () => { cleanup(); reject(new Error('Script load failed')); };
        document.head.appendChild(script);
      });
    }

    // ── APIs (tried in order) ─────────────────────────────────────────────────
    // ip-api.com supports JSONP natively — most reliable free option
    const APIS = [
      {
        name: 'ip-api.com',
        fetch: () => jsonp('http://ip-api.com/json', 'callback'),
        parse: d => ({
          ok:      d.status === 'success',
          country: d.country,
          region:  d.regionName,
          city:    d.city,
          ip:      d.query
        })
      },
      {
        // ipinfo.io supports JSONP via ?callback=
        name: 'ipinfo.io',
        fetch: () => jsonp('https://ipinfo.io', 'callback'),
        parse: d => ({
          ok:      !!d.ip,
          country: d.country,
          region:  d.region,
          city:    d.city,
          ip:      d.ip
        })
      }
    ];

    // ── UI helpers ────────────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);

    function setStatus(msg, isError = false) {
      $('status').textContent = msg;
      $('status').className = 'status' + (isError ? ' error' : '');
    }

    function showResult(info, source) {
      $('val-country').textContent = info.country || 'N/A';
      $('val-region').textContent  = info.region  || 'N/A';
      $('val-city').textContent    = info.city    || 'N/A';
      $('val-ip').textContent      = info.ip      || 'N/A';
      $('val-source').textContent  = `via ${source} · IP-based geolocation`;
      $('result').classList.add('show');
    }

    // ── Main ──────────────────────────────────────────────────────────────────
    async function detectLocation() {
      const btn = $('detectBtn');
      btn.disabled = true;
      btn.textContent = 'Detecting...';
      $('spinner').classList.add('show');
      $('result').classList.remove('show');
      setStatus('');

      let success = false;

      for (const api of APIS) {
        try {
          setStatus(`› trying ${api.name}...`);
          const data = await api.fetch();
          const info = api.parse(data);
          if (!info.ok) throw new Error('Bad response from API');
          showResult(info, api.name);
          setStatus('');
          success = true;
          break;
        } catch (err) {
          console.warn(`[${api.name}] failed:`, err.message);
        }
      }

      if (!success) {
        setStatus('⚠ Could not fetch location. Are you connected to the internet?', true);
      }

      $('spinner').classList.remove('show');
      btn.disabled = false;
      btn.textContent = '🔄 Detect Again';
    }
  </script>
</body>
</html>
